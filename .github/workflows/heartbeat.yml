name: Schedule heartbeat

on:
  schedule:
    # 每月 1 日 04:23 UTC；用于避免 GitHub 在 60 天无仓库活动后停用 schedule。
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Touch heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat
          git add .github/heartbeat
          if git diff --cached --quiet; then
            echo "heartbeat unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: schedule heartbeat $(date -u +%F)"
          for i in 1 2 3; do
            if git pull --rebase --autostash --quiet origin main && git push --quiet; then
              exit 0
            fi
            echo "push 失败，5 秒后重试（$i/3）"
            sleep 5
          done
          echo "::error::heartbeat push failed"
          exit 1
