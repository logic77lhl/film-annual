<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电影年鉴 1895—2026 · 电影元数据库</title>
<meta name="description" content="从 1895 到 2026 的电影年鉴：132 年片单、IMDb 年度 Top 30、华语片 Top 20、影史前 10%，以及影片、导演、类型、国家索引。">
<meta name="theme-color" content="#09090b">
<meta property="og:title" content="电影年鉴 1895—2026 · 电影元数据库">
<meta property="og:description" content="132 年，每年精选 + 华语 20 + 全球 Top 30；可按影片、导演、类型、国家浏览。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309090b'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23d4b176' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23d4b176'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#09090b;
  --bg2:#0d0d10;
  --panel:#121216;
  --panel2:#17171c;
  --text:#e9e5dd;
  --muted:#8d94a1;
  --dim:#606774;
  --gold:#d4b176;
  --gold2:#f1d9a7;
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.14);
  --red:#c96b5a;
  --green:#86b08e;
  --blue:#8fa6b8;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(212,177,118,.28)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 26px}

/* header */
.top{
  position:sticky;top:0;z-index:50;
  background:rgba(9,9,11,.86);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}
.topin{display:flex;align-items:center;gap:22px;height:62px}
.brand{font-family:var(--serif);font-size:19px;letter-spacing:.04em;white-space:nowrap}
.brand span{font-family:var(--sans);font-size:10px;color:var(--dim);letter-spacing:.14em;margin-left:8px}
.nav{display:flex;align-items:center;gap:2px;flex:1}
.nav a{
  padding:6px 10px;border-radius:6px;font-size:13px;color:var(--muted);
  transition:.18s;white-space:nowrap;
}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav a.on{color:var(--gold)}
.search{
  display:flex;align-items:center;gap:8px;
  width:280px;height:34px;padding:0 12px;
  border:1px solid var(--line2);border-radius:18px;
  background:rgba(255,255,255,.03);
}
.search svg{flex:0 0 auto;color:var(--dim)}
.search input{
  width:100%;border:0;outline:0;background:none;color:var(--text);
  font-size:12px;font-family:inherit;
}
.search input::placeholder{color:var(--dim)}
.menu{display:none;background:none;border:0;font-size:20px;color:var(--muted);padding:4px 8px}

/* hero */
.hero{padding:76px 0 34px;border-bottom:1px solid var(--line)}
.kicker{
  font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);
  margin-bottom:16px;
}
.hero h1{
  margin:0 0 18px;font-family:var(--serif);font-weight:500;
  font-size:clamp(38px,6vw,70px);line-height:1.08;letter-spacing:-.02em;
}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{max-width:720px;margin:0;color:var(--muted);font-size:14px;line-height:1.85}
.stats{
  display:grid;grid-template-columns:repeat(6,1fr);gap:18px;
  padding:30px 0 8px;border-bottom:1px solid var(--line);margin-bottom:34px;
}
.stat b{display:block;font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.1}
.stat span{display:block;font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-top:4px}
.stat.gold b{color:var(--gold)}

/* sections */
.section{padding:34px 0}
.section-head{
  display:flex;align-items:baseline;gap:14px;
  margin:0 0 18px;
}
.section-head h2{
  margin:0;font-family:var(--serif);font-weight:500;
  font-size:20px;letter-spacing:.02em;
}
.section-head small{font-size:10px;letter-spacing:.14em;color:var(--dim)}
.section-head .line{flex:1;height:1px;background:var(--line)}
.section-head a{font-size:11px;color:var(--gold);white-space:nowrap}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border:1px solid var(--line2);border-radius:16px;
  background:transparent;font-size:12px;color:var(--muted);
  cursor:pointer;transition:.18s;
}
.chip:hover{color:var(--text);border-color:rgba(212,177,118,.5)}
.chip.on{color:#14120e;background:var(--gold);border-color:var(--gold)}
.chip small{font-size:10px;color:var(--dim)}
.chip.on small{color:rgba(20,18,14,.6)}

/* poster grid */
.poster-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:22px 18px;
}
.card{display:block;min-width:0;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.poster{
  position:relative;aspect-ratio:2/3;border-radius:5px;overflow:hidden;
  background:linear-gradient(145deg,#1b1b21,#101014);
  border:1px solid rgba(255,255,255,.06);
}
.poster img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover}
.poster.ph{display:flex;align-items:center;justify-content:center}
.poster .ph-t{
  position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:42px;color:rgba(212,177,118,.45);
}
.poster.ph .ph-t{position:static}
.pbody{padding:9px 2px 0}
.ptitle{
  font-size:13px;line-height:1.35;font-weight:500;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.pmeta{font-size:10px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prate{display:flex;align-items:baseline;gap:5px;margin-top:5px}
.prate b{font-family:var(--serif);font-size:15px;color:var(--gold);font-weight:500}
.prate span{font-size:9px;color:var(--dim)}
.prank{
  position:absolute;top:6px;left:6px;z-index:2;
  min-width:24px;height:24px;padding:0 6px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(9,9,11,.78);border:1px solid var(--line2);
  font-size:10px;color:var(--gold);backdrop-filter:blur(6px);
}
.card{position:relative}

/* rank list */
.ranklist{border-top:1px solid var(--line)}
.rk{
  display:grid;grid-template-columns:42px 1fr 76px 56px;align-items:center;
  min-height:42px;padding:7px 4px;border-bottom:1px solid var(--line);
  transition:.15s;
}
.rk:hover{background:rgba(255,255,255,.025)}
.rkhead{min-height:30px;color:var(--dim);font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.rkno{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.rkt{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkt i{font-style:normal;font-size:10px;color:var(--dim);margin-left:8px}
.pick{
  display:inline-block;font-size:8px;color:var(--gold);
  border:1px solid rgba(212,177,118,.4);border-radius:3px;
  padding:0 4px;margin-right:6px;vertical-align:1px;
}
.frow-t .pick{font-size:9px;padding:1px 5px;vertical-align:3px}
.rky{font-size:10px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.rkr{font-family:var(--serif);font-size:15px;color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.rknote{font-size:10px;color:var(--dim);line-height:1.7;margin:10px 0 0}

/* year page */
.yearhead{padding:52px 0 22px;border-bottom:1px solid var(--line)}
.dyear{
  font-family:var(--serif);font-size:clamp(62px,11vw,128px);
  line-height:.9;color:var(--gold);letter-spacing:-.04em;
}
.dkey{font-size:11px;letter-spacing:.18em;color:var(--muted);margin:14px 0 8px;text-transform:uppercase}
.yearhead h1{margin:0 0 14px;font-family:var(--serif);font-weight:500;font-size:clamp(24px,3.4vw,38px);line-height:1.2}
.dintro{max-width:780px;margin:0;color:var(--muted);font-size:14px;line-height:1.85}
.dtags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dtag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:12px;padding:3px 9px}

.frow{
  display:grid;grid-template-columns:76px 1fr;gap:18px;
  padding:16px 0;border-bottom:1px solid var(--line);
}
.frow:hover .frow-t{color:var(--gold2)}
.frow .poster{border-radius:4px}
.frow-t{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.25;transition:.15s}
.frow-t span{font-family:var(--sans);font-size:11px;color:var(--dim);margin-left:8px;font-weight:400}
.frow-m{font-size:11px;color:var(--muted);margin-top:3px}
.frow-n{font-size:13px;color:var(--muted);line-height:1.75;margin:7px 0 0;max-width:820px}

.more{border-top:1px solid var(--line)}
.mrow{
  display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:baseline;
  padding:9px 2px;border-bottom:1px solid var(--line);font-size:12px;
}
.mrow .n{font-size:10px;color:var(--dim)}
.mrow b{font-weight:400}
.mrow i{font-style:normal;font-size:10px;color:var(--dim);margin-left:6px}
.mrow small{display:block;font-size:10px;color:var(--dim);margin-top:1px}

.comment{
  margin:34px 0;padding:22px 24px;border-left:2px solid var(--gold);
  background:linear-gradient(90deg,rgba(212,177,118,.06),transparent 70%);
}
.comment h3{margin:0 0 8px;font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.comment p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.9;color:var(--text)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:34px 0 60px}
.pager button{
  text-align:left;background:var(--panel);border:1px solid var(--line);
  padding:14px 16px;border-radius:5px;cursor:pointer;transition:.18s;
}
.pager button:hover{border-color:rgba(212,177,118,.4)}
.pager button.next{text-align:right}
.pager small{display:block;font-size:9px;letter-spacing:.14em;color:var(--dim);margin-bottom:3px}
.pager b{font-family:var(--serif);font-size:15px;font-weight:500}

/* film page */
.back{
  display:inline-flex;align-items:center;gap:6px;
  margin:26px 0 18px;background:none;border:0;padding:0;
  font-size:12px;color:var(--muted);cursor:pointer;
}
.back:hover{color:var(--gold)}
.filmhero{
  display:grid;grid-template-columns:250px 1fr;gap:34px;
  padding:14px 0 36px;border-bottom:1px solid var(--line);
}
.fposter{width:250px}
.finfo{min-width:0}
.finfo h1{
  margin:4px 0 4px;font-family:var(--serif);font-weight:500;
  font-size:clamp(30px,4.6vw,50px);line-height:1.12;letter-spacing:-.02em;
}
.forig{margin:0 0 14px;font-size:13px;color:var(--dim)}
.fmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin:0 0 14px}
.fmeta span{white-space:nowrap}
.frating{display:flex;flex-wrap:wrap;gap:18px;margin:16px 0 18px}
.fr{display:flex;align-items:baseline;gap:6px}
.fr b{font-family:var(--serif);font-size:30px;color:var(--gold);font-weight:500;line-height:1}
.fr span{font-size:9px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.fr small{font-size:10px;color:var(--dim)}
.factions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.fbtn{
  padding:6px 13px;border:1px solid var(--line2);border-radius:16px;
  background:transparent;font-size:11px;color:var(--muted);cursor:pointer;transition:.18s;
}
.fbtn:hover{color:var(--text);border-color:rgba(212,177,118,.5)}
.fbtn.on{background:var(--gold);border-color:var(--gold);color:#14120e}
.stars{display:flex;align-items:center;gap:3px;margin-left:4px}
.stars button{
  background:none;border:0;padding:0 1px;font-size:16px;line-height:1;
  color:var(--dim);cursor:pointer;
}
.stars button.on{color:var(--gold)}
.credits{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.credits b{color:var(--dim);font-weight:400;font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-right:6px}
.credits a{color:var(--text);border-bottom:1px solid rgba(255,255,255,.12)}
.credits a:hover{color:var(--gold);border-color:rgba(212,177,118,.5)}
.prose{padding:30px 0;border-bottom:1px solid var(--line)}
.prose h2{font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin:0 0 10px}
.prose p{margin:0;max-width:820px;font-size:14px;line-height:1.95;color:var(--muted);white-space:pre-line}
.lists{padding:24px 0;border-bottom:1px solid var(--line)}
.lists .chips{gap:6px}
.lists .chip{font-size:11px;padding:4px 10px}
.links{display:flex;flex-wrap:wrap;gap:10px;padding:22px 0;border-bottom:1px solid var(--line)}
.links a{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:4px 11px}
.links a:hover{color:var(--gold);border-color:rgba(212,177,118,.45)}

/* person */
.personhead{padding:52px 0 28px;border-bottom:1px solid var(--line)}
.personhead h1{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(36px,5vw,58px);line-height:1.1}
.personhead .role{font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.personstats{display:flex;flex-wrap:wrap;gap:26px;margin-top:18px}
.personstats div b{display:block;font-family:var(--serif);font-size:24px;font-weight:500;color:var(--gold)}
.personstats div span{font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

/* index grids */
.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.entity{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:12px 14px;border:1px solid var(--line);border-radius:4px;
  background:var(--panel);transition:.18s;
}
.entity:hover{border-color:rgba(212,177,118,.4);background:var(--panel2)}
.entity b{font-weight:400;font-size:13px}
.entity span{font-size:10px;color:var(--dim);white-space:nowrap}
.entity em{font-style:normal;font-family:var(--serif);color:var(--gold);font-size:13px;margin-left:8px}

/* search / filters */
.searchhead{padding:46px 0 20px;border-bottom:1px solid var(--line)}
.searchhead h1{margin:0 0 16px;font-family:var(--serif);font-weight:500;font-size:clamp(30px,4vw,44px)}
.searchbig{display:flex;gap:8px;max-width:720px}
.searchbig input{
  flex:1;height:44px;border:1px solid var(--line2);border-radius:4px;
  background:var(--panel);color:var(--text);padding:0 14px;font-size:14px;font-family:inherit;outline:0;
}
.searchbig input:focus{border-color:rgba(212,177,118,.6)}
.searchbig button{
  height:44px;padding:0 20px;border:0;border-radius:4px;background:var(--gold);
  color:#14120e;font-size:13px;cursor:pointer;
}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.filters select,.filters input{
  height:32px;border:1px solid var(--line2);border-radius:4px;
  background:var(--panel);color:var(--text);padding:0 8px;font-size:11px;font-family:inherit;outline:0;
}
.filters label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.filters label input{height:auto}
.resultmeta{font-size:11px;color:var(--dim);padding:14px 0 0}
.empty{padding:60px 0;color:var(--dim);font-size:13px}

/* list */
.listtabs{display:flex;gap:8px;padding:18px 0;border-bottom:1px solid var(--line)}
.listrow{display:grid;grid-template-columns:1fr 70px 90px 100px;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:12px}
.listrow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow .t small{color:var(--dim);margin-left:6px}
.listrow .s{font-size:10px;color:var(--dim)}
.listrow .u{color:var(--gold);font-size:11px}
.listrow button{background:none;border:1px solid var(--line);border-radius:3px;color:var(--dim);font-size:10px;padding:2px 7px;cursor:pointer}
.listrow button:hover{color:var(--red);border-color:rgba(201,107,90,.4)}
.listtools{display:flex;gap:10px;padding:16px 0}
.listtools button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:11px;color:var(--muted);cursor:pointer}
.listtools button:hover{color:var(--gold);border-color:rgba(212,177,118,.4)}

/* year grid */
.year-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.ycard{
  display:block;padding:12px 12px 10px;border:1px solid var(--line);border-radius:4px;
  background:var(--panel);transition:.18s;min-width:0;
}
.ycard:hover{border-color:rgba(212,177,118,.42);background:var(--panel2);transform:translateY(-2px)}
.ycard .yn{display:block;font-family:var(--serif);font-size:24px;line-height:1.1;color:var(--gold)}
.ycard .yk{display:block;font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ycard .ym{display:block;font-size:9px;color:var(--dim);margin-top:4px}
.decade-block{margin:0 0 26px}
.decade-block h3{
  margin:0 0 10px;font-family:var(--serif);font-weight:500;font-size:15px;
  color:var(--muted);letter-spacing:.06em;
}
.decade-block h3 span{font-family:var(--sans);font-size:9px;color:var(--dim);letter-spacing:.14em;margin-left:6px}

/* footer */
.foot{border-top:1px solid var(--line);margin-top:60px;padding:26px 0 40px;color:var(--dim);font-size:10px;line-height:1.9}
.foot a{color:var(--muted);border-bottom:1px solid var(--line)}
.foot a:hover{color:var(--gold)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;z-index:100;transform:translate(-50%,20px);
  background:#1c1c22;border:1px solid var(--line2);border-radius:22px;
  padding:8px 18px;font-size:12px;color:var(--text);opacity:0;pointer-events:none;
  transition:.25s;backdrop-filter:blur(10px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* misc */
.notfound{padding:90px 0;text-align:center;color:var(--dim)}
.notfound h1{font-family:var(--serif);font-weight:500;color:var(--text);font-size:36px;margin:0 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

@media(max-width:1000px){
  .stats{grid-template-columns:repeat(3,1fr);gap:22px}
  .search{width:220px}
  .nav a{padding:6px 7px}
}
@media(max-width:820px){
  .wrap{padding:0 18px}
  .topin{gap:10px}
  .nav{
    display:none;position:absolute;top:62px;left:0;right:0;
    flex-direction:column;align-items:stretch;gap:0;
    background:rgba(9,9,11,.98);border-bottom:1px solid var(--line);padding:8px 18px 14px;
  }
  .nav.open{display:flex}
  .nav a{padding:9px 8px;font-size:13px}
  .search{flex:1;width:auto;min-width:0}
  .menu{display:block}
  .hero{padding:48px 0 26px}
  .stats{grid-template-columns:repeat(3,1fr);gap:16px;padding:24px 0 6px}
  .stat b{font-size:28px}
  .filmhero{grid-template-columns:150px 1fr;gap:18px}
  .fposter{width:150px}
  .finfo h1{font-size:30px}
  .fr b{font-size:24px}
  .frow{grid-template-columns:62px 1fr;gap:13px}
  .frow-t{font-size:17px}
  .poster-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px 12px}
  .year-grid{grid-template-columns:repeat(3,1fr)}
  .listrow{grid-template-columns:1fr 60px 70px 34px}
  .pager{grid-template-columns:1fr}
  .comment p{font-size:15px}
}
@media(max-width:520px){
  .brand span{display:none}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat b{font-size:24px}
  .filmhero{grid-template-columns:1fr}
  .fposter{width:150px}
  .searchbig{flex-direction:column}
  .searchbig button{height:40px}
  .rk{grid-template-columns:32px 1fr 56px 44px;gap:4px}
  .rkt{font-size:12px}
  .rkt i{display:none}
  .poster-grid{grid-template-columns:repeat(2,1fr)}
  .year-grid{grid-template-columns:repeat(2,1fr)}
  .entity-grid{grid-template-columns:1fr}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters select{width:100%;min-width:0}
  .filters label{width:100%;justify-content:flex-start}
}

</style>
</head>
<body>
<header class="top">
  <div class="wrap topin">
    <a class="brand" href="#/">电影年鉴 <span>1895—2026</span></a>
    <nav class="nav" id="nav">
      <a href="#/">首页</a>
      <a href="#/all">影史</a>
      <a href="#/search">影片</a>
      <a href="#/people">导演</a>
      <a href="#/genres">类型</a>
      <a href="#/countries">国家</a>
      <a href="#/list">我的</a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="搜片名、导演、演员、年份…" autocomplete="off">
    </form>
    <button class="menu" id="menuBtn" aria-label="菜单">☰</button>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer class="foot">
  <div class="wrap">
    <p>数据：IMDb 每日数据集 + TMDB · 评分与票数为公开数据，仅供参考 · 不构成观看建议</p>
    <p><a href="#/about">数据说明</a> · <a href="offline.html" id="offlineLink">离线单文件版</a> · <a href="https://github.com/logic77lhl/film-annual" target="_blank" rel="noopener">GitHub</a></p>
  </div>
</footer>

<div id="toast" class="toast" role="status"></div>
<noscript><div class="wrap" style="padding:40px 0;color:#8d94a1">这个页面需要 JavaScript。请换一个浏览器，或在设置里允许 JavaScript。</div></noscript>
<script>
(async function () {
  const app = document.getElementById('app');
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let DATA;
  try {
    DATA = window.__FILMS__ || await (await fetch('data/films.json')).json();
  } catch (e) {
    app.innerHTML = `<div class="notfound"><h1>数据加载失败</h1><p>请通过线上地址打开；离线阅读请用 <a href="offline.html" style="color:var(--gold)">offline.html</a>。</p></div>`;
    return;
  }

  const F = DATA.films || {};
  const P = DATA.people || {};
  const G = DATA.genres || {};
  const C = DATA.countries || {};
  const Y = DATA.years || {};
  const ALL = DATA.allTime || [];
  const STATS = DATA.stats || {
    films: Object.keys(F).length,
    top30: 0,
    curated: 0,
    cn: 0,
    years: Object.keys(Y).length,
    directors: 0,
    actors: 0,
    countries: Object.keys(C).length,
    genres: Object.keys(G).length
  };

  const titleOf = f => f.t || f.o || '未命名';
  const origOf = f => (f.o && f.t && f.o !== f.t ? f.o : '');
  const ratingOf = f => Number(f.r || f.tr || 0);
  const votesOf = f => Number(f.v || f.tv || 0);
  const weighted = f => {
    const r = ratingOf(f), v = votesOf(f);
    return r ? r * Math.log10((v || 0) + 10) : 0;
  };
  const fmtVotes = v => {
    v = Number(v || 0);
    if (v >= 10000) return (v / 10000).toFixed(v >= 100000 ? 0 : 1) + '万';
    if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
    return String(v);
  };
  const fmtNum = n => Number(n || 0).toLocaleString('zh-CN');
  const fmtRuntime = m => {
    m = Number(m || 0);
    if (!m) return '';
    const h = Math.floor(m / 60), r = m % 60;
    return h ? `${h}h${r ? ' ' + r + 'm' : ''}` : `${r}m`;
  };
  const genreName = id => G[id]?.name || '';
  const countryName = c => C[c]?.name || c;
  const genreNames = f => (f.genres || []).map(genreName).filter(Boolean);
  const countryNames = f => (f.countries || []).map(countryName).filter(Boolean);
  const isChinese = f => !!(f.cnRank || ['zh', 'cn', 'yue'].includes(f.lang) || (f.countries || []).some(c => ['CN', 'HK', 'TW', 'MO', 'SG'].includes(c)));
  const filmHref = key => '#/film/' + encodeURIComponent(key);
  const personHref = name => '#/person/' + encodeURIComponent(name);
  const yearHref = y => '#/year/' + y;

  const posterHtml = (f, size = 'w200', cls = '') => {
    const t = titleOf(f);
    const ph = `<span class="ph-t">${esc(t.slice(0, 1))}</span>`;
    if (!f.p) return `<div class="poster ph ${cls}">${ph}</div>`;
    return `<div class="poster ${cls}">${ph}<img loading="lazy" src="https://image.tmdb.org/t/p/${size}${f.p}" alt="${esc(t)}" data-poster="${esc(f.p)}" onerror="if(!this.dataset.x){this.dataset.x=1;this.src='https://wsrv.nl/?url='+encodeURIComponent('image.tmdb.org/t/p/${size}'+this.dataset.poster)}else{this.style.display='none'}"></div>`;
  };

  const filmCard = (key, opts = {}) => {
    const f = F[key];
    if (!f) return '';
    const rank = opts.rank ? `<span class="prank">${opts.rank}</span>` : '';
    const sub = opts.sub || [f.year, countryNames(f)[0]].filter(Boolean).join(' · ');
    const r = opts.tmdb ? (f.tr || f.r) : ratingOf(f);
    const v = opts.tmdb ? (f.tv || f.v) : votesOf(f);
    return `<a class="card" href="${filmHref(key)}">
      ${rank}${posterHtml(f)}
      <div class="pbody">
        <div class="ptitle">${esc(titleOf(f))}</div>
        <div class="pmeta">${esc(sub)}</div>
        <div class="prate"><b>${r ? Number(r).toFixed(1) : '—'}</b><span>${v ? fmtVotes(v) : ''}</span></div>
      </div>
    </a>`;
  };

  const sectionHead = (title, small = '', link = '', linkText = '查看全部') => `<div class="section-head"><h2>${esc(title)}</h2><i class="line"></i>${small ? `<small>${esc(small)}</small>` : ''}${link ? `<a href="${link}">${esc(linkText)}</a>` : ''}</div>`;

  const notfound = (msg = '没找到这一页') => `<div class="notfound"><h1>404</h1><p>${esc(msg)}</p><p style="margin-top:14px"><a href="#/" style="color:var(--gold)">回首页</a></p></div>`;

  const toast = msg => {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 1600);
  };

  /* ---------- my list ---------- */
  const LS_KEY = 'filmYearbook.my.v1';
  const getMy = () => {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) { return {}; }
  };
  const setMy = (key, patch) => {
    const m = getMy();
    m[key] = { ...(m[key] || {}), ...patch, at: Date.now() };
    localStorage.setItem(LS_KEY, JSON.stringify(m));
  };
  const delMy = key => {
    const m = getMy();
    delete m[key];
    localStorage.setItem(LS_KEY, JSON.stringify(m));
  };
  const myStatusLabel = s => s === 'watched' ? '看过' : s === 'want' ? '想看' : '';

  /* ---------- routing ---------- */
  const parseHash = () => {
    const h = location.hash || '#/';
    const raw = h.slice(1);
    const qi = raw.indexOf('?');
    const path = qi >= 0 ? raw.slice(0, qi) : raw;
    const qs = qi >= 0 ? raw.slice(qi + 1) : '';
    const parts = path.split('/').filter(Boolean).map(p => {
      try { return decodeURIComponent(p); } catch (e) { return p; }
    });
    return { parts, params: new URLSearchParams(qs) };
  };

  const setActive = parts => {
    const root = parts[0] || 'home';
    const map = {
      home: '#/', all: '#/all', search: '#/search', film: '#/search',
      people: '#/people', person: '#/people',
      genres: '#/genres', genre: '#/genres',
      countries: '#/countries', country: '#/countries',
      list: '#/list'
    };
    const target = map[root] || '';
    $$('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === target));
  };

  /* ---------- home ---------- */
  const renderHome = () => {
    const topGenres = Object.values(G).sort((a, b) => b.count - a.count).slice(0, 14);
    const topCountries = Object.values(C).sort((a, b) => b.count - a.count).slice(0, 14);
    const directors = Object.values(P)
      .filter(p => (p.directed || []).length >= 2)
      .sort((a, b) => (b.avg || 0) - (a.avg || 0) || b.count - a.count)
      .slice(0, 8);
    const picks = Object.entries(F)
      .filter(([, f]) => f.curated)
      .sort((a, b) => weighted(b[1]) - weighted(a[1]))
      .slice(0, 7);
    const years = Object.keys(Y).map(Number).sort((a, b) => a - b);
    const decades = {};
    years.forEach(y => { const d = Math.floor(y / 10) * 10; (decades[d] = decades[d] || []).push(y); });

    app.innerHTML = `
      <section class="hero">
        <div class="kicker">A FILM A YEAR · 1895—2026</div>
        <h1>一百三十二年，<br>每年留<em>几部片</em>。</h1>
        <p>从卢米埃尔兄弟在巴黎地下室卖出的第一张票，到今年的《奥德赛》。132 份年度影单，加上 IMDb 年度 Top 30、华语片 Top 20、影史前 10%。现在也可以按影片、导演、类型、国家逛。</p>
        <form class="searchbig" id="heroSearch" style="margin-top:24px">
          <input name="q" placeholder="搜片名、导演、演员、年份、类型…" autocomplete="off">
          <button type="submit">搜索</button>
        </form>
      </section>

      <div class="stats">
        <div class="stat"><b>${fmtNum(STATS.films || Object.keys(F).length)}</b><span>FILMS</span></div>
        <div class="stat"><b>${fmtNum(STATS.directors || 0)}</b><span>DIRECTORS</span></div>
        <div class="stat"><b>${fmtNum(STATS.actors || 0)}</b><span>ACTORS</span></div>
        <div class="stat"><b>${fmtNum(STATS.countries || Object.keys(C).length)}</b><span>COUNTRIES</span></div>
        <div class="stat"><b>${fmtNum(STATS.genres || Object.keys(G).length)}</b><span>GENRES</span></div>
        <div class="stat gold"><b>${fmtNum(STATS.cn || 0)}</b><span>华语片</span></div>
      </div>

      <section class="section">
        ${sectionHead('编辑精选', '从 132 年里挑出来的', '#/search', '去片库')}
        <div class="poster-grid">${picks.map(([k]) => filmCard(k)).join('')}</div>
      </section>

      <section class="section">
        ${sectionHead('按类型', '点进去看这类片', '#/genres', '全部类型')}
        <div class="chips">${topGenres.map(g => `<a class="chip" href="#/genre/${g.id}">${esc(g.name)}<small>${fmtNum(g.count)}</small></a>`).join('')}</div>
      </section>

      <section class="section">
        ${sectionHead('按国家', '按制片国家/地区', '#/countries', '全部国家')}
        <div class="chips">${topCountries.map(c => `<a class="chip" href="#/country/${encodeURIComponent(c.code)}">${esc(c.name)}<small>${fmtNum(c.count)}</small></a>`).join('')}</div>
      </section>

      <section class="section">
        ${sectionHead('精选导演', '按收录作品平均分', '#/people', '导演索引')}
        <div class="entity-grid">
          ${directors.map(p => `<a class="entity" href="${personHref(p.name)}"><b>${esc(p.name)}</b><span>${(p.directed || []).length} 部<em>${p.avg ? p.avg.toFixed(1) : '—'}</em></span></a>`).join('')}
        </div>
      </section>

      <section class="section">
        ${sectionHead('年份', '1895—2026 · 按十年分组', '#/all', '影史 Top 10%')}
        ${Object.keys(decades).sort((a, b) => a - b).map(d => `
          <div class="decade-block">
            <h3>${d}s <span>${decades[d].length} YEARS</span></h3>
            <div class="year-grid">
              ${decades[d].map(y => {
                const m = Y[y] || {};
                const n = new Set([...(m.curated || []), ...(m.extra || []), ...(m.cn || []), ...(m.top30 || [])]).size;
                return `<a class="ycard" href="${yearHref(y)}"><span class="yn">${y}</span><span class="yk">${esc(m.keyword || '')}</span><span class="ym">${n} 部</span></a>`;
              }).join('')}
            </div>
          </div>`).join('')}
      </section>
    `;
  };

  /* ---------- year ---------- */
  const rankRow = (key, rank, opts = {}) => {
    const f = F[key];
    if (!f) return '';
    const r = opts.tmdb ? (f.tr || f.r) : (f.r || f.tr);
    const v = opts.tmdb ? (f.tv || f.v) : (f.v || f.tv);
    return `<a class="rk" href="${filmHref(key)}">
      <span class="rkno">${String(rank).padStart(2, '0')}</span>
      <span class="rkt">${opts.pick ? '<span class="pick">精选</span>' : ''}${esc(titleOf(f))}${origOf(f) ? `<i>${esc(origOf(f))}</i>` : ''}</span>
      <span class="rky">${v ? fmtVotes(v) : ''}</span>
      <span class="rkr">${r ? Number(r).toFixed(1) : '—'}</span>
    </a>`;
  };

  const renderYear = year => {
    const m = Y[year];
    if (!m) return notfound('这一年还没有条目');
    const curated = (m.curated || []).map(k => [k, F[k]]).filter(x => x[1]);
    const extra = (m.extra || []).map(k => [k, F[k]]).filter(x => x[1]);
    const cn = (m.cn || []).map(k => [k, F[k]]).filter(x => x[1]);
    const top = (m.top30 || []).map(k => [k, F[k]]).filter(x => x[1]);
    const all = [...new Set([...curated, ...extra, ...cn, ...top].map(x => x[0]))].map(k => F[k]);
    const rated = all.map(ratingOf).filter(Boolean);
    const avg = rated.length ? rated.reduce((a, b) => a + b, 0) / rated.length : 0;
    const yrs = Object.keys(Y).map(Number).sort((a, b) => a - b);
    const idx = yrs.indexOf(Number(year));
    const prev = idx > 0 ? yrs[idx - 1] : null;
    const next = idx >= 0 && idx < yrs.length - 1 ? yrs[idx + 1] : null;
    const best = [...curated].sort((a, b) => ratingOf(b[1]) - ratingOf(a[1]))[0]?.[0];

    app.innerHTML = `
      <button class="back" data-back data-to="#/">← 返回年表</button>
      <header class="yearhead">
        <div class="dyear">${year}</div>
        <div class="dkey">${esc(m.era || '')} · ${esc(m.keyword || '')}</div>
        <h1>${year} 年，值得先看的 ${curated.length} 部</h1>
        <p class="dintro">${esc(m.intro || '')}</p>
        <div class="dtags">
          <span class="dtag">${fmtNum(all.length)} 部收录</span>
          <span class="dtag">平均 ${avg ? avg.toFixed(1) : '—'}</span>
          ${cn.length ? `<span class="dtag">华语 ${cn.length}</span>` : ''}
          ${top.length ? `<span class="dtag">IMDb Top ${top.length}</span>` : ''}
        </div>
      </header>

      ${curated.length ? `<section class="section">
        ${sectionHead('THE LIST', '年度精选')}
        ${curated.map(([k, f]) => {
          const dir = f.curated?.director || (f.directors || []).join(' / ');
          const cty = f.curated?.country || countryNames(f).join(' / ');
          return `<a class="frow" href="${filmHref(k)}">
            ${posterHtml(f, 'w200')}
            <div>
              <div class="frow-t">${k === best ? '<span class="pick">年度之选</span>' : ''}${esc(titleOf(f))}${origOf(f) ? `<span>${esc(origOf(f))}</span>` : ''}</div>
              <div class="frow-m">${esc([dir, cty, genreNames(f).slice(0, 2).join(' / ')].filter(Boolean).join(' · '))}</div>
              ${f.curated?.note ? `<p class="frow-n">${esc(f.curated.note)}</p>` : ''}
            </div>
          </a>`;
        }).join('')}
      </section>` : ''}

      ${extra.length ? `<section class="section">
        ${sectionHead('ALSO WORTH A LOOK', '补看')}
        <div class="more">
          ${extra.map(([k, f], i) => `<a class="mrow" href="${filmHref(k)}">
            <span class="n">${String(i + 1).padStart(2, '0')}</span>
            <span><b>${esc(titleOf(f))}</b>${origOf(f) ? `<i>${esc(origOf(f))}</i>` : ''}<small>${esc([f.extra?.director || f.curated?.director || (f.directors || []).join(' / '), f.extra?.country || f.curated?.country || countryNames(f).join(' / ')].filter(Boolean).join(' · '))}</small></span>
          </a>`).join('')}
        </div>
      </section>` : ''}

      ${cn.length ? `<section class="section">
        ${sectionHead('CHINESE CINEMA', `${cn.length} 部 · TMDB`, '#/search?cn=1', '只看华语')}
        <div class="ranklist">
          <div class="rk rkhead"><span></span><span>片名</span><span>票数</span><span>评分</span></div>
          ${cn.map(([k], i) => rankRow(k, F[k]?.cnRank || i + 1, { tmdb: true })).join('')}
        </div>
        <p class="rknote">华语片榜来自 TMDB（普通话 + 粤语），按评分排序、同分看票数；票数门槛 30。</p>
      </section>` : ''}

      ${top.length ? `<section class="section">
        ${sectionHead('YEAR TOP 30', `${top.length} 部 · IMDb`, '#/all', '影史榜')}
        <div class="ranklist">
          <div class="rk rkhead"><span></span><span>片名</span><span>票数</span><span>评分</span></div>
          ${top.map(([k], i) => rankRow(k, F[k]?.top30Rank || i + 1)).join('')}
        </div>
        <p class="rknote">Top 30 来自 IMDb 每日数据集，按评分排序、同分看票数；没有对应中文名的影片保留原名。</p>
      </section>` : ''}

      ${m.comment ? `<div class="comment"><h3>点评</h3><p>${esc(m.comment)}</p></div>` : ''}

      <div class="pager">
        ${prev ? `<button data-go="${prev}"><small>上一年</small><b>${prev} · ${esc(Y[prev]?.keyword || '')}</b></button>` : '<span></span>'}
        ${next ? `<button class="next" data-go="${next}"><small>下一年</small><b>${next} · ${esc(Y[next]?.keyword || '')}</b></button>` : '<span></span>'}
      </div>
    `;
  };

  /* ---------- film ---------- */
  const relatedSection = (title, keys) => {
    const list = [...new Set(keys)].filter(k => F[k]).slice(0, 6);
    if (!list.length) return '';
    return `<section class="section">${sectionHead(title, '', '#/search', '去片库')}<div class="poster-grid">${list.map(k => filmCard(k)).join('')}</div></section>`;
  };

  const renderFilm = key => {
    const f = F[key];
    if (!f) return notfound('这部片还没有收录');
    const my = getMy()[key] || {};
    const dirs = f.directors || (f.curated?.director ? [f.curated.director] : (f.extra?.director ? [f.extra.director] : []));
    const cast = (f.cast || []).slice(0, 6);
    const year = f.year || 0;
    const r = f.r || 0, tr = f.tr || 0;
    const lists = [];
    if (year) lists.push(`<a class="chip" href="${yearHref(year)}">${year} 年</a>`);
    if (f.top30Rank) lists.push(`<a class="chip" href="${yearHref(year)}">IMDb Top 30 · #${f.top30Rank}</a>`);
    if (f.cnRank) lists.push(`<a class="chip" href="${yearHref(year)}">华语 Top 20 · #${f.cnRank}</a>`);
    if (f.allTimeRank) lists.push(`<a class="chip" href="#/all">影史前 10% · #${f.allTimeRank}</a>`);
    if (f.curated) lists.push(`<span class="chip">年度精选</span>`);
    if (f.curated?.year && f.curated.year !== year) lists.push(`<a class="chip" href="${yearHref(f.curated.year)}">${f.curated.year} 年精选</a>`);
    if (f.extra) lists.push(`<span class="chip">补看</span>`);
    if (f.extra?.year && f.extra.year !== year) lists.push(`<a class="chip" href="${yearHref(f.extra.year)}">${f.extra.year} 年补看</a>`);

    const sameDir = dirs[0] ? (P[dirs[0]]?.directed || []).filter(k => k !== key) : [];
    const sameGenre = f.genres?.[0] ? (G[f.genres[0]]?.films || []).filter(k => k !== key && F[k]).sort((a, b) => weighted(F[b]) - weighted(F[a])).slice(0, 8) : [];
    const sameCountry = f.countries?.[0] ? (C[f.countries[0]]?.films || []).filter(k => k !== key && F[k]).sort((a, b) => weighted(F[b]) - weighted(F[a])).slice(0, 8) : [];
    const sameCollection = f.collection?.id ? Object.keys(F).filter(k => k !== key && F[k].collection?.id === f.collection.id).sort((a, b) => (F[a].year || 0) - (F[b].year || 0)).slice(0, 8) : [];

    app.innerHTML = `
      <button class="back" data-back data-to="${year ? yearHref(year) : '#/'}">← ${year ? year + ' 年' : '返回'}</button>
      <div class="filmhero">
        ${posterHtml(f, 'w342', 'fposter')}

          <span><button data-remove data-key="${esc(k)}">移除</button></span>
        </div>`).join('')}
      </div>` : `<div class="empty">还没有标记。打开任意一部片，点「看过」或「想看」。</div>`}
    `;
  };

  /* ---------- about ---------- */
  const renderAbout = () => {
    app.innerHTML = `
      <header class="searchhead"><div class="kicker">ABOUT</div><h1>数据说明</h1></header>
      <section class="section prose" style="border:0">
        <h2>年度榜</h2>
        <p>每年 30 部来自 IMDb 官方每日数据集，按评分排序、同分看票数。票数门槛按年代从 100 递增到 20,000；1930 年后只收电影，1930 年前含短片。共 ${Number(STATS.top30 || 0).toLocaleString()} 部。</p>
        <h2>影史前 10%</h2>
        <p>从 ${Number(STATS.top30 || 0).toLocaleString()} 部年度 Top 30 里，筛出票数 ≥ 5 万的 ${fmtNum(STATS.qualified || 0)} 部，再按评分取前 ${ALL.length} 部。同分看票数。</p>
        <h2>华语片</h2>
        <p>来自 TMDB 的 <code>with_original_language=zh</code>（普通话 + 粤语），按年取票数最高的 60 部，再按评分排序取前 20；票数门槛 30。冷门片可能缺席。</p>
        <h2>影片资料</h2>
        <p>简介、类型、片长、上映日期、主演、制片公司、系列来自 TMDB；中文译名优先用 TMDB <code>zh-CN</code>，其次 IMDb <code>title.akas</code> 的 CN/TW/HK 标题。精选层保留人工译名。</p>
        <h2>缺什么</h2>
        <p>在 ${fmtNum(STATS.films || Object.keys(F).length)} 部影片里，约 ${fmtNum(STATS.noChinese || 0)} 部没有中文片名，基本是早期默片、印度/土耳其地方片。部分 Top 30 影片只有基础资料，没有主演和片长；精选与华语片优先补全。</p>
        <h2>离线版</h2>
        <p>线上版是完整的数据库；离线版是单个 HTML 文件，双击即可打开。海报不会加载，其余数据与线上版一致。地址：<a href="offline.html" style="color:var(--gold)">offline.html</a>。</p>
        <h2>数据更新</h2>
        <p>${esc(DATA.generatedAt || '')}</p>
      </section>
    `;
  };

  /* ---------- router ---------- */
  const route = () => {
    const { parts, params } = parseHash();
    closeNav();
    setActive(parts);

    if (parts[0] === 'search') {
      $('#searchInput').value = params.get('q') || '';
    } else {
      $('#searchInput').value = '';
    }

    if (!parts.length) renderHome();
    else if (/^\d{4}$/.test(parts[0])) location.replace('#/year/' + parts[0]);
    else if (parts[0] === 'year' && /^\d{4}$/.test(parts[1] || '')) renderYear(parts[1]);
    else if (parts[0] === 'film' && parts[1]) renderFilm(parts[1]);
    else if (parts[0] === 'person' && parts[1]) renderPerson(parts[1]);
    else if (parts[0] === 'genre' && parts[1]) renderGenre(parts[1]);
    else if (parts[0] === 'country' && parts[1]) renderCountry(parts[1]);
    else if (parts[0] === 'people') renderPeopleIndex(params);
    else if (parts[0] === 'genres') renderGenresIndex();
    else if (parts[0] === 'countries') renderCountriesIndex();
    else if (parts[0] === 'search') renderSearch(params);
    else if (parts[0] === 'all') renderAll(params);
    else if (parts[0] === 'list') renderList(params);
    else if (parts[0] === 'about') renderAbout();
    else app.innerHTML = notfound();

    window.scrollTo(0, 0);
  };

  /* ---------- header / events ---------- */
  const closeNav = () => $('#nav')?.classList.remove('open');
  $('#menuBtn').addEventListener('click', () => $('#nav').classList.toggle('open'));
  $('#nav').addEventListener('click', e => { if (e.target.closest('a')) closeNav(); });
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('#searchInput').value.trim();
    location.hash = '#/search' + (q ? '?q=' + encodeURIComponent(q) : '');
  });

  document.addEventListener('submit', e => {
    if (e.target.id === 'heroSearch') {
      e.preventDefault();
      const q = e.target.querySelector('input')?.value.trim() || '';
      location.hash = '#/search' + (q ? '?q=' + encodeURIComponent(q) : '');
    }
  });

  document.addEventListener('change', e => {
    const el = e.target.closest('[data-filter]');
    if (!el) return;
    const { params } = parseHash();
    const p = new URLSearchParams(params);
    const name = el.dataset.filter;
    if (el.type === 'checkbox') {
      if (el.checked) p.set(name, '1'); else p.delete(name);
    } else {
      if (el.value) p.set(name, el.value); else p.delete(name);
    }
    location.hash = '#/search' + (p.toString() ? '?' + p.toString() : '');
  });

  document.addEventListener('click', e => {
    const back = e.target.closest('[data-back]');
    if (back) { location.hash = back.dataset.to || '#/'; return; }

    const go = e.target.closest('[data-go]');
    if (go) { location.hash = '#/year/' + go.dataset.go; return; }

    const my = e.target.closest('[data-my]');
    if (my) {
      const key = my.dataset.key;
      setMy(key, { status: my.dataset.my });
      const group = my.parentElement;
      group.querySelectorAll('[data-my]').forEach(b => b.classList.toggle('on', b.dataset.my === my.dataset.my));
      toast(my.dataset.my === 'watched' ? '已标记看过' : '已加入想看');
      return;
    }

    const star = e.target.closest('[data-star]');
    if (star) {
      const key = star.dataset.key;
      const n = Number(star.dataset.star);
      setMy(key, { rating: n });
      const group = star.parentElement;
      [...group.querySelectorAll('[data-star]')].forEach(b => b.classList.toggle('on', Number(b.dataset.star) <= n));
      toast(`已打 ${n} 星`);
      if (parseHash().parts[0] === 'list') route();
      return;
    }

    const remove = e.target.closest('[data-remove]');
    if (remove) {
      delMy(remove.dataset.key);
      route();
      return;
    }

    const clear = e.target.closest('[data-clear]');
    if (clear) {
      if (confirm('清空整个片单？这个操作不能撤销。')) {
        localStorage.removeItem(LS_KEY);
        route();
      }
      return;
    }

    const exp = e.target.closest('[data-export]');
    if (exp) {
      const my = getMy();
      const rows = [['title', 'original', 'year', 'status', 'myRating']];
      Object.entries(my).forEach(([k, v]) => {
        const f = F[k];
        if (!f) return;
        rows.push([titleOf(f), f.o || '', f.year || '', myStatusLabel(v.status), v.rating || '']);
      });
      const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '我的电影年鉴.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return;
    }
  });

  buildHay();
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
