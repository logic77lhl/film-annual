<title>电影年鉴 1895—2026 · 每年的年度影单</title>
<style>
  :root{
    --bg:#09090b; --bg2:#0f0f13; --panel:#141419; --panel2:#1a1a21;
    --line:#26262f; --line2:#343440;
    --text:#ece8df; --muted:#918d85; --muted2:#6b6862;
    --accent:#d4b176; --accent-soft:rgba(212,177,118,.13);
    --blue:#8fa6b8;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    line-height:1.7; -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(1200px 600px at 15% -10%, rgba(212,177,118,.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(143,166,184,.06), transparent 55%);
    background-attachment:fixed;
  }
  ::selection{background:var(--accent);color:#111}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:18px;
    padding:14px clamp(16px,4vw,48px);
    background:rgba(9,9,11,.82); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .brand b{font-family:var(--serif);font-size:19px;letter-spacing:.12em;font-weight:600}
  .brand span{font-size:11px;color:var(--muted2);letter-spacing:.14em}
  .search{flex:1;max-width:420px;margin-left:auto;position:relative}
  .search input{
    width:100%;padding:9px 14px 9px 36px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-size:13px;outline:none;transition:.2s;
  }
  .search input:focus{border-color:var(--accent);background:var(--panel2)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45}
  .btn-rand{
    padding:9px 16px;border-radius:999px;border:1px solid var(--line2);
    font-size:12.5px;color:var(--muted);transition:.2s;white-space:nowrap;
    text-decoration:none;display:inline-flex;align-items:center;
  }
  .btn-rand:hover{color:var(--accent);border-color:var(--accent)}

  /* ---------- hero ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
  .hero{padding:clamp(48px,9vw,104px) 0 34px}
  .kicker{font-size:11.5px;letter-spacing:.32em;color:var(--accent);text-transform:uppercase;margin-bottom:22px}
  .hero h1{
    font-family:var(--serif);font-weight:500;
    font-size:clamp(38px,7.4vw,84px);line-height:1.12;letter-spacing:.01em;
  }
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero p{max-width:620px;margin-top:24px;color:var(--muted);font-size:15px;line-height:1.9}
  .stats{display:flex;flex-wrap:wrap;gap:clamp(24px,5vw,64px);margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
  .stat b{display:block;font-family:var(--serif);font-size:clamp(26px,3.4vw,38px);color:var(--text);font-weight:500}
  .stat span{font-size:11.5px;letter-spacing:.16em;color:var(--muted2)}
  .herolinks{margin-top:30px}
  .herolinks a{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);
    text-decoration:none;border-bottom:1px solid rgba(212,177,118,.35);padding-bottom:3px;
  }
  .herolinks a span{transition:transform .2s}
  .herolinks a:hover span{transform:translateX(4px)}

  /* ---------- era nav ---------- */
  .eranav{
    position:sticky;top:61px;z-index:40;
    display:flex;gap:8px;overflow-x:auto;padding:14px 0;
    background:linear-gradient(to bottom,var(--bg) 78%,transparent);
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right,#000 93%,transparent);
    mask-image:linear-gradient(to right,#000 93%,transparent);
  }
  .eranav::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    font-size:12px;color:var(--muted);transition:.18s;letter-spacing:.02em;
  }
  .chip:hover{border-color:var(--line2);color:var(--text)}
  .chip.on{background:var(--accent-soft);border-color:rgba(212,177,118,.5);color:var(--accent)}

  /* ---------- decade grid ---------- */
  .decade{margin:34px 0 10px;scroll-margin-top:130px}
  .decade-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .decade-head h2{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:.06em;color:var(--muted)}
  .decade-head i{flex:1;height:1px;background:var(--line)}
  .decade-head small{font-size:11px;color:var(--muted2);letter-spacing:.12em}
  .ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .ycard{
    position:relative;text-align:left;padding:16px 15px 14px;border-radius:10px;
    border:1px solid var(--line);background:linear-gradient(160deg,var(--panel),#101014);
    transition:transform .18s ease,border-color .18s,background .18s;
    overflow:hidden;
  }
  .ycard:before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:var(--accent);opacity:0;transition:.18s;
  }
  .ycard:hover{transform:translateY(-3px);border-color:var(--line2);background:linear-gradient(160deg,#1a1a21,#121217)}
  .ycard:hover:before{opacity:1}
  .ynum{display:block;font-family:var(--serif);font-size:30px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .ykey{display:block;margin-top:7px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ymeta{display:block;margin-top:12px;font-size:10.5px;color:var(--muted2);letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}
  .dots{display:flex;gap:3px}
  .dots i{width:4px;height:4px;border-radius:50%;background:var(--line2)}
  .dots i.on{background:var(--accent)}
  .empty{padding:70px 0;text-align:center;color:var(--muted2);font-size:14px}

  /* ---------- detail ---------- */
  #detail{display:none;padding-bottom:90px}
  #detail.show{display:block;animation:rise .38s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .back{margin:26px 0 0;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;transition:.2s}
  .back:hover{color:var(--accent)}
  .dhead{position:relative;padding:30px 0 34px;border-bottom:1px solid var(--line)}
  .dyear{
    font-family:var(--serif);font-size:clamp(72px,15vw,150px);line-height:.92;
    color:transparent;-webkit-text-stroke:1px #3a3a45;letter-spacing:-.02em;
    position:absolute;right:0;top:12px;pointer-events:none;user-select:none;
  }
  .dkey{font-size:11.5px;letter-spacing:.28em;color:var(--accent);margin-bottom:14px}
  .dhead h1{font-family:var(--serif);font-size:clamp(28px,4.4vw,46px);font-weight:500;line-height:1.25;max-width:720px}
  .dintro{max-width:680px;margin-top:20px;color:var(--muted);font-size:15px;line-height:1.95}
  .dtags{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
  .dtag{font-size:11px;letter-spacing:.1em;color:var(--muted2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}

  .section-label{display:flex;align-items:center;gap:14px;margin:44px 0 4px}
  .section-label span{font-size:11px;letter-spacing:.26em;color:var(--muted2)}
  .section-label i{flex:1;height:1px;background:var(--line)}
  .lbl-count{font-size:10.5px;color:var(--muted2);letter-spacing:.08em;white-space:nowrap}
  .film{display:grid;grid-template-columns:52px 1fr;gap:18px;padding:26px 0;border-bottom:1px solid var(--line)}
  .fno{font-family:var(--serif);font-size:13px;color:var(--muted2);padding-top:5px;letter-spacing:.06em}
  .ftitle{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.35}
  .ftitle span{font-size:13px;color:var(--muted2);font-weight:400;margin-left:9px;letter-spacing:.02em}
  .fmeta{margin-top:7px;font-size:12px;color:var(--muted2);letter-spacing:.04em}
  .flinks{display:inline-flex;gap:7px;margin-left:10px;vertical-align:1px}
  .flinks a{font-size:10px;letter-spacing:.06em;color:var(--muted2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;transition:.18s;text-decoration:none}
  .flinks a:hover{color:var(--accent);border-color:rgba(212,177,118,.5)}
  .fnote{margin-top:12px;font-size:14px;color:#c9c4ba;line-height:1.85;max-width:760px}
  .more{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;margin-top:2px}
  .mfilm{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:17px 0;border-bottom:1px solid var(--line)}
  .mno{font-family:var(--serif);font-size:12px;color:var(--muted2);padding-top:3px;letter-spacing:.06em}
  .mfilm b{font-family:var(--serif);font-size:16.5px;font-weight:500;line-height:1.4;display:block}
  .mfilm i{font-size:11.5px;color:var(--muted2);font-style:normal;margin-left:6px}
  .mfilm small{display:block;margin-top:6px;font-size:11.5px;color:var(--muted2);letter-spacing:.04em}
  .topbtn{
    position:fixed;right:22px;bottom:22px;z-index:60;width:42px;height:42px;border-radius:50%;
    background:var(--panel2);border:1px solid var(--line2);color:var(--muted);
    opacity:0;pointer-events:none;transform:translateY(8px);transition:.22s;
  }
  .topbtn.show{opacity:1;pointer-events:auto;transform:none}
  .topbtn:hover{color:var(--accent);border-color:var(--accent)}

  /* ---------- Top 30 ---------- */
  .ranklist{margin-top:6px;border-top:1px solid var(--line)}
  .rk{
    display:grid;grid-template-columns:40px 1fr 54px 48px;gap:12px;align-items:baseline;
    padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .15s;
  }
  .rk:hover{background:rgba(255,255,255,.022)}
  .rkno{font-family:var(--serif);font-size:12px;color:var(--muted2);letter-spacing:.04em}
  .rkt{font-size:14.5px;color:#ddd8ce;line-height:1.5}
  .rkt i{font-style:normal;font-size:11px;color:var(--muted2);margin-left:8px}
  .rky{font-size:11px;color:var(--muted2);text-align:right;letter-spacing:.04em}
  .rkr{font-family:var(--serif);font-size:14.5px;color:var(--accent);text-align:right}
  .rkhead{pointer-events:none;border-bottom:1px solid var(--line2);padding:6px 2px}
  .rkhead span{font-size:9.5px;letter-spacing:.14em;color:var(--muted2);font-family:var(--sans)}
  .rkhead .rkr{color:var(--muted2);font-size:9.5px}
  .rk.pick .rkt:before{
    content:"精选";font-size:9px;letter-spacing:.1em;color:var(--accent);
    border:1px solid rgba(212,177,118,.38);padding:1px 4px;border-radius:3px;
    margin-right:7px;vertical-align:2px;
  }
  .rk.short .rkt:after{content:"短片";font-size:9px;color:var(--muted2);margin-left:7px;opacity:.7}
  .ranknote{font-size:11px;color:var(--muted2);line-height:1.75;margin-top:12px;max-width:760px}

  /* ---------- all time ---------- */
  #allview{display:none;padding-bottom:90px}
  #allview.show{display:block;animation:rise .38s ease both}
  .allhead{padding:34px 0 26px;border-bottom:1px solid var(--line)}
  .allhead h1{font-family:var(--serif);font-size:clamp(32px,5vw,54px);font-weight:500;margin-top:10px}
  .allhead p{max-width:680px;margin-top:16px;color:var(--muted);font-size:14.5px;line-height:1.9}
  .allbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 8px}
  .allbar .chip{font-size:11.5px}
  .allcount{font-size:11px;color:var(--muted2);letter-spacing:.14em;margin-left:auto;align-self:center}
  .comment{
    margin:40px 0 0;padding:26px 28px;border-left:2px solid var(--accent);
    background:linear-gradient(90deg,rgba(212,177,118,.11),rgba(212,177,118,.025) 85%,rgba(212,177,118,.02));border-radius:0 8px 8px 0;
  }
  .comment h3{font-size:11px;letter-spacing:.26em;color:var(--accent);font-weight:500;margin-bottom:12px}
  .comment p{font-family:var(--serif);font-size:17px;line-height:1.95;color:#ded9cf;max-width:760px}
  .pager{display:flex;justify-content:space-between;gap:14px;margin-top:52px}
  .pager button{
    flex:1;padding:16px 18px;border:1px solid var(--line);border-radius:10px;
    text-align:left;transition:.2s;background:var(--panel);
  }
  .pager button:hover{border-color:var(--accent);background:var(--panel2)}
  .pager small{display:block;font-size:10.5px;letter-spacing:.18em;color:var(--muted2);margin-bottom:5px}
  .pager b{font-family:var(--serif);font-weight:500;font-size:15px}
  .pager .next{text-align:right}

  footer{border-top:1px solid var(--line);padding:34px 0 60px;color:var(--muted2);font-size:11.5px;letter-spacing:.06em;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

  @media (max-width:560px){
    .dyear{display:none}
  }
  @media (max-width:640px){
    .brand span{display:none}
    .btn-rand{display:none}
    .eranav{top:57px}
    .ygrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
    .ynum{font-size:25px}
    .film{grid-template-columns:32px 1fr;gap:12px}
    .rk{grid-template-columns:28px 1fr 46px 36px;gap:8px;padding:10px 1px}
    .rkt{font-size:13px}
    .rkt i{display:none}
    .rk.pick .rkt:before{content:"·";border:none;padding:0;margin-right:3px;font-size:16px;vertical-align:-1px}
    .rky{font-size:10px}
    .rkr{font-size:13px}
    .more{grid-template-columns:1fr}
    .comment{padding:20px}
    .comment p{font-size:15.5px}
    .dyear{font-size:80px;opacity:.55}
  }
</style>
</head>

/* ---------- 年代 ---------- */
const ERAS = [
  {name:"默片草创", from:1895, to:1914},
  {name:"默片黄金期", from:1915, to:1929},
  {name:"好莱坞黄金时代", from:1930, to:1945},
  {name:"战后现代主义", from:1946, to:1959},
  {name:"新浪潮", from:1960, to:1969},
  {name:"新好莱坞", from:1970, to:1979},
  {name:"大片与作者", from:1980, to:1989},
  {name:"独立与全球化", from:1990, to:1999},
  {name:"数字时代", from:2000, to:2009},
  {name:"流媒体前夜", from:2010, to:2019},
  {name:"分众时代", from:2020, to:2026}
];
const eraOf = yr => (ERAS.find(e => yr >= e.from && yr <= e.to) || ERAS[ERAS.length-1]).name;

DATA.sort((a,b) => a.year - b.year);

/* 中文片名映射：用已有精选里的原名去对 IMDb 条目 */
DATA.forEach(d => d.films.forEach(f => { if (f.o) CN.set(norm(f.o), f.t); }));
Object.keys(EXTRA).forEach(y => EXTRA[y].forEach(x => { if (x[1]) CN.set(norm(x[1]), x[0].replace(/[《》]/g,'')) }));

function nameOf(primary, original, id){
  const orig = original || primary;
  const cn = CN.get(norm(orig)) || CN.get(norm(primary)) || CN_ID[id];
  return { t: cn || orig, o: cn ? orig : '' };
}

function voteLabel(v){
  if (v >= 10000) return (v/10000).toFixed(v >= 100000 ? 0 : 1) + '万';
  if (v >= 1000) return (v/1000).toFixed(1) + 'k';
  return String(v);
}

function top30Html(year, d){
  const arr = (TOP.years && TOP.years[year]) ? TOP.years[year] : [];
  if (!arr.length) return '';
  const picks = new Set(d.films.map(f => norm(f.o || f.t)));
  return `
    <div class="section-label"><span>YEAR TOP 30 · IMDb</span><i></i><small class="lbl-count">${arr.length} 部 · 按评分 · 同分看票数</small></div>
    <div class="ranklist">
      <div class="rk rkhead"><span></span><span>片名</span><span>票数</span><span>评分</span></div>
      ${arr.map((x,i)=>{
        const n = nameOf(x[1], x[2], x[0]);
        const pick = picks.has(norm(x[2])) || picks.has(norm(x[1])) || picks.has(norm(n.t));
        return `<a class="rk${pick?' pick':''}${x[6]?' short':''}" href="https://www.imdb.com/title/${x[0]}/" target="_blank" rel="noopener">
          <span class="rkno">${String(i+1).padStart(2,'0')}</span>
          <span class="rkt">${n.t}${n.o?`<i>${n.o}</i>`:''}</span>
          <span class="rky">${voteLabel(x[4])}</span>
          <span class="rkr">${x[3].toFixed(1)}</span>
        </a>`;
      }).join('')}
    </div>
    <p class="ranknote">Top 30 来自 IMDb 每日数据集，按评分排序、同分看票数；没有对应中文名的影片保留原名。</p>`;
}

function cnFilmsHtml(year){
  const arr = (CN_FILMS.years && CN_FILMS.years[year]) ? CN_FILMS.years[year] : [];
  if (!arr.length) return '';
  return `
    <div class="section-label"><span>CHINESE CINEMA · 年度华语</span><i></i><small class="lbl-count">${arr.length} 部 · TMDB</small></div>
    <div class="ranklist cnlist">
      <div class="rk rkhead"><span></span><span>片名</span><span>票数</span><span>评分</span></div>
      ${arr.map((x,i)=>{
        const orig = x[2] && x[2] !== x[1] ? `<i>${x[2]}</i>` : '';
        return `<a class="rk" href="https://www.themoviedb.org/movie/${x[0]}" target="_blank" rel="noopener">
          <span class="rkno">${String(i+1).padStart(2,'0')}</span>
          <span class="rkt">${x[1]}${orig}</span>
          <span class="rky">${voteLabel(x[5])}</span>
          <span class="rkr">${x[4].toFixed(1)}</span>
        </a>`;
      }).join('')}
    </div>
    <p class="ranknote">华语片榜来自 TMDB（普通话 + 粤语），按评分排序、同分看票数；票数门槛 30，太冷门的片可能缺席。</p>`;
}

/* ---------- 首页渲染 ---------- */
const grid = document.getElementById('grid');
const home = document.getElementById('home');
const detail = document.getElementById('detail');
const empty = document.getElementById('empty');
const allview = document.getElementById('allview');
let activeEra = '全部';
let query = '';

function buildEraNav(){
  const nav = document.getElementById('eraNav');
  const items = ['全部', ...ERAS.map(e => e.name)];
  nav.innerHTML = items.map(n =>
    `<button class="chip${n===activeEra?' on':''}" data-era="${n}">${n}</button>`
  ).join('');
  nav.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    activeEra = b.dataset.era;
    closeDetail(false);
    buildEraNav();
    renderGrid();
  });
}

function decadeLabel(d){ return d + 's'; }

function renderGrid(){
  const q = query.trim().toLowerCase();
  const list = DATA.filter(d => {
    if (activeEra !== '全部' && d.era !== activeEra) return false;
    if (!q) return true;
    const hay = [String(d.year), d.keyword, d.intro, d.comment, d.era,
      ...d.films.flatMap(x => [x.t, x.o, x.d, x.c, x.n]),
      ...((TOP.years && TOP.years[d.year]) || []).flatMap(x => [x[1], x[2]])].join(' ').toLowerCase();
    return hay.includes(q);
  });

  grid.innerHTML = '';
  empty.hidden = list.length > 0;

  const groups = {};
  list.forEach(d => {
    const k = Math.floor(d.year/10)*10;
    (groups[k] = groups[k] || []).push(d);
  });

  Object.keys(groups).sort((a,b)=>a-b).forEach(dec => {
    const sec = document.createElement('section');
    sec.className = 'decade';
    sec.id = 'dec' + dec;
    sec.innerHTML = `<div class="decade-head"><h2>${decadeLabel(dec)}</h2><i></i><small>${groups[dec].length} YEARS</small></div>`;
    const g = document.createElement('div');
    g.className = 'ygrid';
    groups[dec].forEach(d => {
      const b = document.createElement('button');
      b.className = 'ycard';
      b.dataset.year = d.year;
      b.innerHTML = `
        <span class="ynum">${d.year}</span>
        <span class="ykey">${d.keyword}</span>
        <span class="ymeta"><span>${d.era}</span><span class="dots">${[0,1,2,3].map(i=>`<i class="${i<Math.min(d.films.length,4)?'on':''}"></i>`).join('')}</span></span>`;
      b.onclick = () => location.hash = d.year;
      g.appendChild(b);
    });
    sec.appendChild(g);
    grid.appendChild(sec);
  });

  document.getElementById('filmCount').textContent = DATA.reduce((s,d)=>s+totalOf(d),0);
  document.getElementById('topCount').textContent = TOP.total || 0;
  document.getElementById('cnCount').textContent = CN_FILMS.total || 0;
}

function closeDetail(push=true){
  detail.classList.remove('show');
  detail.innerHTML = '';
  home.style.display = '';
  if (push && location.hash) history.replaceState('', document.title, location.pathname + location.search);
}

function closeAll(){
  allview.classList.remove('show');
  allview.innerHTML = '';
  home.style.display = '';
  if (location.hash) history.replaceState('', document.title, location.pathname + location.search);
}

let allDecade = '全部';

function allRowHtml(x, i){
  const n = nameOf(x[2], x[3], x[1]);
  return `<a class="rk" href="https://www.imdb.com/title/${x[1]}/" target="_blank" rel="noopener">
    <span class="rkno">${String(i+1).padStart(3,'0')}</span>
    <span class="rkt">${n.t}${n.o?`<i>${n.o}</i>`:''}</span>
    <span class="rky">${x[0]}</span>
    <span class="rkr">${x[4].toFixed(1)}</span>
  </a>`;
}

function paintAll(){
  const all = TOP.allTime || [];
  const list = all.filter(x => allDecade === '全部' || Math.floor(x[0]/10)*10 === allDecade);
  const box = allview.querySelector('#alllist');
  if (!box) return;
  box.innerHTML = `<div class="rk rkhead"><span></span><span>片名</span><span>年份</span><span>评分</span></div>` +
    list.map(x => allRowHtml(x, all.indexOf(x))).join('');
  const c = allview.querySelector('#allcount');
  if (c) c.textContent = `${list.length} 部`;
}

function renderAll(){
  allDecade = '全部';
  const list = TOP.allTime || [];
  const decades = [...new Set(list.map(x => Math.floor(x[0]/10)*10))].sort((a,b)=>a-b);
  allview.innerHTML = `
    <button class="back" id="allBack">← 返回年表</button>
    <div class="allhead">
      <div class="dkey">ALL TIME · TOP 10%</div>
      <h1>影史前 10%</h1>
      <p>从 1895—2026 每年 Top 30 的 ${TOP.total || 0} 部里，筛出 IMDb 票数 5 万以上的 ${TOP.qualified || 0} 部，按评分取前 ${list.length} 部。同分看票数，排名只代表这套算法，不代表真理。</p>
    </div>
    <div class="section-label"><span>THE ${list.length}</span><i></i></div>
    <div class="allbar" id="allbar">
      ${['全部', ...decades].map(d => `<button class="chip${d==='全部'?' on':''}" data-dec="${d}">${d==='全部'?'全部':d+'s'}</button>`).join('')}

  allview.querySelector('#allBack').onclick = () => closeAll();
  allview.querySelectorAll('#allbar .chip').forEach(b => b.onclick = () => {
    allDecade = b.dataset.dec === '全部' ? '全部' : Number(b.dataset.dec);
    allview.querySelectorAll('#allbar .chip').forEach(x => x.classList.toggle('on', x === b));
    paintAll();
  });
  paintAll();
}

function route(){
  const h = location.hash.replace('#','').trim();
  if (h === 'all') {
    detail.classList.remove('show');
    home.style.display = 'none';
    allview.classList.add('show');
    renderAll();
    window.scrollTo({top:0, behavior:'instant'});
    return;
  }
  allview.classList.remove('show');
  if (/^\d{4}$/.test(h) && renderDetail(h)) {
    home.style.display = 'none';
    detail.classList.add('show');
    window.scrollTo({top:0, behavior:'instant'});
  } else {
    detail.classList.remove('show');
    home.style.display = '';
  }
}

document.getElementById('randBtn').onclick = () => {
  const d = DATA[Math.floor(Math.random()*DATA.length)];
  location.hash = d.year;
};

window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (!detail.classList.contains('show')) return;
  const cur = Number(location.hash.replace('#',''));
  const idx = DATA.findIndex(x => x.year === cur);
  if (e.key === 'Escape') closeDetail();
  if (e.key === 'ArrowLeft' && idx > 0) location.hash = DATA[idx-1].year;
  if (e.key === 'ArrowRight' && idx < DATA.length-1) location.hash = DATA[idx+1].year;
});

const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', () => topBtn.classList.toggle('show', window.scrollY > 700), {passive:true});
topBtn.onclick = () => window.scrollTo({top:0, behavior:'smooth'});

buildEraNav();
renderGrid();
route();
</script>
</body>
</html>
